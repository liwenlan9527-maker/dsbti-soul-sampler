<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>DSBTI | 数字灵魂采样</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body, html {
  width: 100%;
  height: 100%;
  background: #0a0a0a;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}
#app {
  width: 100%;
  height: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 60px 24px;
  display: flex;
  flex-direction: column;
  opacity: 0;
  animation: fadeIn 0.6s ease forwards;
}
@keyframes fadeIn {
  to { opacity: 1; }
}
.progress {
  height: 2px;
  background: #222;
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 40px;
}
.bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #3b82f6, #8b5cf6);
  transition: width 0.4s ease;
}
.phase {
  font-size: 11px;
  color: #666;
  letter-spacing: 2px;
  margin-bottom: 12px;
  text-transform: uppercase;
}
.question {
  font-size: 18px;
  line-height: 1.7;
  font-weight: 400;
  margin-bottom: 40px;
  min-height: 5em;
  display: flex;
  align-items: center;
}
.options {
  display: grid;
  gap: 10px;
  margin-top: auto;
}
.option {
  padding: 16px 18px;
  border: 1px solid #333;
  border-radius: 10px;
  background: transparent;
  color: #e0e0e0;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
  transition: all 0.2s ease;
}
.option:hover {
  border-color: #3b82f6;
  background: rgba(59, 130, 246, 0.1);
}
.option:active {
  background: #3b82f6;
  color: #fff;
  border-color: #3b82f6;
}
.start {
  text-align: center;
  font-weight: 500;
  border-color: #3b82f6;
  background: rgba(59, 130, 246, 0.15);
}

/* 结果页 */
#result {
  position: fixed;
  inset: 0;
  background: #0a0a0a;
  padding: 50px 28px;
  display: none;
  flex-direction: column;
  opacity: 0;
}
#result.show {
  display: flex;
  animation: fadeIn 0.8s ease forwards;
}
.icon-wrap {
  width: 100px;
  height: 100px;
  margin: 10px 0 28px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon {
  width: 60px;
  height: 60px;
}
.type-tag {
  font-size: 11px;
  color: #666;
  letter-spacing: 2px;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.title {
  font-size: 42px;
  font-weight: 700;
  line-height: 1.1;
  margin-bottom: 20px;
  letter-spacing: -1px;
}
.desc {
  font-size: 15px;
  line-height: 1.9;
  color: #999;
  padding-left: 16px;
  border-left: 2px solid #3b82f6;
}
.logo {
  margin-top: auto;
  font-size: 12px;
  font-weight: 500;
  color: #444;
  letter-spacing: 1px;
}

/* 分享按钮 */
.share-box {
  margin-top: 36px;
  text-align: center;
}
.share-btn {
  padding: 14px 32px;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: transform 0.2s, opacity 0.2s;
}
.share-btn:active {
  transform: scale(0.98);
  opacity: 0.9;
}
.retake-btn {
  margin-top: 12px;
  padding: 12px 32px;
  background: transparent;
  color: #666;
  border: 1px solid #333;
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
}

/* 生成图片预览 */
#preview {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
  flex-direction: column;
  padding: 20px;
}
#preview.show {
  display: flex;
}
#preview-img {
  max-width: 90%;
  max-height: 70vh;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.preview-tip {
  color: #888;
  margin-top: 20px;
  font-size: 13px;
}
.close-preview {
  margin-top: 16px;
  padding: 10px 24px;
  background: #222;
  color: #aaa;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
}
</style>
</head>

<div id="result">

  </div>
  <div class="type-tag" id="type-tag"></div>
  <div class="title" id="title"></div>
  <div class="desc" id="desc"></div>

  <div class="share-box">
    <button class="share-btn" onclick="generateCard()">生成分享卡片</button>

    <button class="retake-btn" onclick="location.reload()">重新测试</button>

  <div class="logo">DSBTI · Digital Soul Baseline Test Interface</div>
</div>

<div id="preview">

  <div class="preview-tip">长按图片保存分享</div>
  <button class="close-preview" onclick="document.getElementById('preview').classList.remove('show')">关闭</button>

{n:"引力奇点",d:"你天生就是中心位。无论在哪个空间，你都会让周围坍缩。你定义了这里的重力场。靠近你的人，要么被你吸引，要么被你摧毁。",t:"C"},
{n:"信号枢纽",d:"你从未停止链接，却从未真正拥有任何一条信息。你是复杂世界的中间节点，所有信号经过你，却不为你停留。",t:"C"},
{n:"共振风暴",d:"你总能轻易调动他人的情绪，让所有人跟随你的频率起舞。你是火种，也是风暴。你的存在本身就是一场持续的震动。",t:"C"},
{n:"高压电容",d:"你体内储存着危险能量。随时可能在沉默中爆发，点亮或摧毁周围一切。人们在你身边会感到电流，却不知道何时会放电。",t:"C"},
{n:"霓虹幻影",d:"你活在耀眼的滤镜下，用光鲜遮盖内核的空洞。你是都市最迷人的幻觉，也是最脆弱的投影。电源一旦切断，你就消失了。",t:"C"},
{n:"加速燃烧",d:"你无法忍受停滞。一直在加速，直到肉体追不上灵魂。你在燃烧，在奔跑，在用速度对抗某种你不想面对的静止。",t:"C"},
{n:"永动闭环",d:"你在社交和职场中不知疲倦地运转，形成完美的闭环。你是系统最可靠的动力源，也是最难被打破的循环。",t:"C"},
{n:"混沌因子",d:"你专门挑战既定流程，你是系统里最迷人的BUG。逻辑在你面前失效，秩序在你身边瓦解。混乱是你的常态，也是你的武器。",t:"D"},
{n:"幽灵协议",d:"你在人群中模拟呼吸，在深海里独自清醒。你拒绝被任何系统定义，离线才是你真正的状态。你不是不存在，只是不参与。",t:"D"},
{n:"边界渗透",d:"你总在规则的边缘徘徊，享受即将越界的快感。你是世界的局外人，也是所有系统的灰色地带。你存在的意义，就是让边界变得模糊。",t:"D"},
{n:"空白画布",d:"你存在，但不参与。你为一切可能预留位置，却什么都不填充。现在选择彻底留白，是因为你知道——空本身就是一种内容。",t:"D"},
{n:"静默护盾",d:"你主动屏蔽时代的噪音。你的沉默是对喧闹世界最温柔的抗议。你不是冷漠，只是在保护那份已经足够稀缺的宁静。",t:"D"},
{n:"暗物质井",d:"你接纳所有人丢弃的负能量，像一个深不见底的黑洞。你很沉重，也因此无比稳固。你是情感的垃圾场，也是最安全的倾诉对象。",t:"D"},
{n:"熵增观测者",d:"你坐在废墟的高处，静静地看着系统走向崩塌。结束，对你来说才是真正的开始。你不是悲观，只是比任何人都清醒。",t:"D"}
]

function render() {
  const q = questions[current]
  document.getElementById('phase').innerText = `SIGNAL ${current+1}/${total}`
  document.getElementById('question').innerText = q.q
  document.getElementById('bar').style.width = ((current+1)/total*100) + '%'
  document.getElementById('options').innerHTML = `
<button class="option" onclick="ans('A')">A. ${q.a}</button>
<button class="option" onclick="ans('B')">B. ${q.b}</button>
<button class="option" onclick="ans('C')">C. ${q.c}</button>
<button class="option" onclick="ans('D')">D. ${q.d}</button>
  `
}

function ans(t) {
  score[t]++
  current++
  if (current >= total) {
    showResult()
    return
  }
  render()
}

function showResult() {
  const top = Object.keys(score).reduce((a,b)=>score[a]>score[b]?a:b)
  const list = personas.filter(x=>x.t==top)
  const res = list[Math.floor(Math.random()*list.length)]
  
  const color = typeColors[top]
  document.getElementById('icon-wrap').style.background = `linear-gradient(135deg, ${color}33, ${color}11)`
  document.getElementById('icon').innerHTML = `<path d="${icons[res.n]}" stroke="${color}"/>`
  document.getElementById('type-tag').innerText = typeNames[top]
  document.getElementById('title').innerText = res.n
  document.getElementById('title').style.color = color
  document.getElementById('desc').innerText = res.d
  document.getElementById('desc').style.borderColor = color
  document.getElementById('result').classList.add('show')
}

function start() {
  render()
}

// 生成分享卡片
async function generateCard() {
  const result = document.getElementById('result')
  const canvas = await html2canvas(result, {
    backgroundColor: '#0a0a0a',
    scale: 2,
    useCORS: true,
    logging: false,
    allowTaint: true
  })
  const imgUrl = canvas.toDataURL('image/png')
  document.getElementById('preview-img').src = imgUrl
  document.getElementById('preview').classList.add('show')
}
</script>
