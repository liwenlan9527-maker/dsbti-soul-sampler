<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>DSBTI | 灵魂采样系统</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body, html {
  width: 100%;
  height: 100%;
  background: #ffffff;
  color: #111111;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}
#app {
  width: 100%;
  height: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 60px 24px;
  display: flex;
  flex-direction: column;
  opacity: 0;
  animation: fadeIn 0.6s ease forwards;
}
@keyframes fadeIn {
  to { opacity: 1; }
}
.progress {
  height: 3px;
  background: #f1f1f1;
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 40px;
}
.bar {
  height: 100%;
  width: 0%;
  background: #111;
  transition: width 0.4s ease;
}
.phase {
  font-size: 12px;
  color: #999;
  letter-spacing: 1px;
  margin-bottom: 12px;
}
.question {
  font-size: 19px;
  line-height: 1.6;
  font-weight: 500;
  margin-bottom: 40px;
  min-height: 6em;
  display: flex;
  align-items: center;
}
.options {
  display: grid;
  gap: 12px;
  margin-top: auto;
}
.option {
  padding: 18px 20px;
  border: 1px solid #e0e0e0;
  border-radius: 12px;
  background: #fff;
  font-size: 15px;
  text-align: left;
  cursor: pointer;
  transition: all 0.2s ease;
}
.option:hover {
  border-color: #111;
  background: #fafafa;
}
.option:active {
  background: #111;
  color: #fff;
}
.start {
  text-align: center;
  font-weight: 500;
}

/* 结果页 */
#result {
  position: fixed;
  inset: 0;
  background: #fff;
  padding: 60px 32px;
  display: none;
  flex-direction: column;
  opacity: 0;
}
#result.show {
  display: flex;
  animation: fadeIn 0.8s ease forwards;
}
.icon {
  width: 80px;
  height: 80px;
  margin: 20px 0 32px;
}
.title {
  font-size: 48px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 24px;
  letter-spacing: -1px;
}
.desc {
  font-size: 16px;
  line-height: 1.8;
  color: #333;
  border-left: 3px solid #111;
  padding-left: 16px;
}
.logo {
  margin-top: auto;
  font-size: 14px;
  font-weight: 600;
  color: #999;
}

/* 分享按钮 */
.share-box {
  margin-top: 40px;
  text-align: center;
}
.share-btn {
  padding: 14px 30px;
  background: #111;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
}
.share-btn:active {
  opacity: 0.8;
}

/* 生成图片预览 */
#preview {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
  flex-direction: column;
  padding: 20px;
}
#preview.show {
  display: flex;
}
#preview-img {
  max-width: 90%;
  max-height: 70vh;
  border-radius: 16px;
  border: 2px solid #fff;
  object-fit: contain;
  background: #fff;
}
.preview-tip {
  color: #fff;
  margin-top: 20px;
  font-size: 14px;
}
</style>
</head>
<body>

<div id="app">
  <div class="phase" id="phase">SYSTEM INIT</div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="question" id="question">
    欢迎接入 DSBTI 灵魂采样系统<br>
    28 个维度，锚定你的数字存在
  </div>
  <div class="options" id="options">
    <button class="option start" onclick="start()">开始采样</button>
  </div>
</div>

<div id="result">
  <svg class="icon" id="icon" viewBox="0 0 100 100" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
  <div class="title" id="title"></div>
  <div class="desc" id="desc"></div>

  <div class="share-box">
    <button class="share-btn" onclick="generateCard()">生成分享卡片</button>
  </div>

  <div class="logo">DSBTI · 灵魂采样系统</div>
</div>

<!-- 图片预览弹窗 -->
<div id="preview">
  <img id="preview-img" alt="人格卡片">
  <div class="preview-tip">长按图片保存分享</div>
</div>

function render() {
  const q = questions[current]
  document.getElementById('phase').innerText = `${current+1}/${total}`
  document.getElementById('question').innerText = q.q
  document.getElementById('bar').style.width = ((current+1)/total*100) + '%'
  document.getElementById('options').innerHTML = `
<button class="option" onclick="ans('A')">A. ${q.a}</button>
<button class="option" onclick="ans('B')">B. ${q.b}</button>
<button class="option" onclick="ans('C')">C. ${q.c}</button>
<button class="option" onclick="ans('D')">D. ${q.d}</button>
  `
}

function ans(t) {
  score[t]++
  current++
  if (current >= total) {
    showResult()
    return
  }
  render()
}

function showResult() {
  const top = Object.keys(score).reduce((a,b)=>score[a]>score[b]?a:b)
  const list = personas.filter(x=>x.t==top)
  const res = list[Math.floor(Math.random()*list.length)]
  document.getElementById('icon').innerHTML = `<path d="${icons[res.n]}"/>`
  document.getElementById('title').innerText = res.n
  document.getElementById('desc').innerText = res.d
  document.getElementById('result').classList.add('show')
}

function start() {
  render()
}

// 生成分享卡片
async function generateCard() {
  const result = document.getElementById('result')
  const canvas = await html2canvas(result, {
    backgroundColor: '#ffffff',
    scale: 2,
    useCORS: true
  })
  const imgUrl = canvas.toDataURL('image/png')
  document.getElementById('preview-img').src = imgUrl
  document.getElementById('preview').classList.add('show')
}
</script>

</html>
