<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSBTI 灵魂采样系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shine: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #1a1a1e;
        }

        /* ========== 真正的流动彩色背景 ========== */
        .flow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: #1a1a1e;
            overflow: hidden;
        }

        .flow-gradient {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(147, 112, 219, 0.5) 0%, transparent 25%),
                radial-gradient(circle at 80% 20%, rgba(255, 182, 193, 0.4) 0%, transparent 25%),
                radial-gradient(circle at 40% 70%, rgba(64, 224, 208, 0.4) 0%, transparent 25%),
                radial-gradient(circle at 70% 80%, rgba(255, 218, 185, 0.45) 0%, transparent 25%),
                radial-gradient(circle at 50% 50%, rgba(176, 196, 222, 0.35) 0%, transparent 30%);
            animation: flowMove 30s ease-in-out infinite;
        }

        @keyframes flowMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5%, 3%) rotate(5deg); }
            50% { transform: translate(-3%, 5%) rotate(-3deg); }
            75% { transform: translate(-5%, -3%) rotate(3deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .flow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            mix-blend-mode: screen;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, rgba(147, 112, 219, 0.6), rgba(255, 182, 193, 0.4));
            top: -100px;
            left: -100px;
            animation: blob1 20s ease-in-out infinite;
        }

        .blob-2 {
            width: 600px;
            height: 600px;
            background: linear-gradient(225deg, rgba(64, 224, 208, 0.5), rgba(176, 196, 222, 0.4));
            top: 30%;
            right: -150px;
            animation: blob2 25s ease-in-out infinite;
        }

        .blob-3 {
            width: 450px;
            height: 450px;
            background: linear-gradient(315deg, rgba(255, 218, 185, 0.55), rgba(221, 160, 221, 0.4));
            bottom: -50px;
            left: 30%;
            animation: blob3 22s ease-in-out infinite;
        }

        .blob-4 {
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, rgba(255, 105, 180, 0.4), rgba(100, 149, 237, 0.4));
            top: 50%;
            left: 50%;
            animation: blob4 28s ease-in-out infinite;
        }

        .blob-5 {
            width: 350px;
            height: 350px;
            background: linear-gradient(180deg, rgba(255, 215, 0, 0.4), rgba(255, 99, 71, 0.4));
            top: 20%;
            right: 20%;
            animation: blob5 18s ease-in-out infinite;
        }

        @keyframes blob1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(100px, 50px) scale(1.1); }
            66% { transform: translate(-50px, 100px) scale(0.95); }
        }

        @keyframes blob2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-80px, 60px) scale(1.05); }
            66% { transform: translate(40px, -80px) scale(1.1); }
        }

        @keyframes blob3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, -40px) scale(1.15); }
        }

        @keyframes blob4 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-30%, -70%) scale(0.9); }
        }

        @keyframes blob5 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-30px, 50px) rotate(20deg); }
        }

        /* ========== Main Container ========== */
        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 520px;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== Welcome Screen ========== */
        .welcome-container {
            text-align: center;
        }

        .title-container {
            margin-bottom: 60px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #9370db, #db7093);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(147, 112, 219, 0.3);
        }

        .logo svg {
            width: 50px;
            height: 50px;
        }

        .main-title {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            letter-spacing: 4px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            letter-spacing: 2px;
        }

        .intro-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 50px;
            padding: 0 20px;
        }

        .btn {
            background: linear-gradient(135deg, #9370db, #db7093);
            border: none;
            color: white;
            padding: 18px 50px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(147, 112, 219, 0.4);
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(147, 112, 219, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* ========== Destination Screen ========== */
        .destination-container {
            text-align: center;
        }

        .destination-title {
            font-size: 28px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 40px;
        }

        .dest-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .dest-card {
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dest-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-5px);
        }

        .dest-card.selected {
            background: rgba(147, 112, 219, 0.2);
            border-color: rgba(147, 112, 219, 0.5);
        }

        .dest-icon {
            font-size: 50px;
            margin-bottom: 16px;
        }

        .dest-name {
            font-size: 20px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
        }

        .dest-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* ========== Question Screen ========== */
        .question-container {
            position: relative;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-bottom: 40px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #9370db, #db7093);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .question-meta {
            text-align: center;
            margin-bottom: 20px;
        }

        .question-number {
            font-size: 13px;
            color: rgba(147, 112, 219, 0.8);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .question-emoji {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.5;
            text-align: center;
            margin-bottom: 30px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: inherit;
            text-align: left;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.85);
            overflow: hidden;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(8px);
        }

        .option-btn.selected {
            background: linear-gradient(135deg, rgba(147, 112, 219, 0.3), rgba(219, 112, 147, 0.3));
            border-color: rgba(147, 112, 219, 0.5);
        }

        .option-letter {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .option-btn.selected .option-letter {
            background: linear-gradient(135deg, #9370db, #db7093);
            color: white;
            box-shadow: 0 4px 15px rgba(147, 112, 219, 0.4);
        }

        .option-text {
            color: rgba(255, 255, 255, 0.85);
            font-size: 15px;
            line-height: 1.5;
        }

        /* ========== Loading Screen ========== */
        .loading-container {
            text-align: center;
        }

        .loading-orb-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 40px;
        }

        .loading-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9370db, #db7093);
            animation: core-pulse 2s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(147, 112, 219, 0.5);
        }

        @keyframes core-pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        .loading-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(147, 112, 219, 0.6);
            animation: spin 2s linear infinite;
        }

        .loading-ring:nth-child(2) {
            top: 12px;
            left: 12px;
            width: calc(100% - 24px);
            height: calc(100% - 24px);
            border-top-color: rgba(219, 112, 147, 0.5);
            animation-duration: 2.5s;
            animation-direction: reverse;
        }

        .loading-ring:nth-child(3) {
            top: 24px;
            left: 24px;
            width: calc(100% - 48px);
            height: calc(100% - 48px);
            border-top-color: rgba(255, 218, 185, 0.4);
            animation-duration: 3s;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 20px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
        }

        .loading-status {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }

        /* ========== Report Screen ========== */
        .report-container {
            width: 100%;
            max-width: 560px;
            padding: 20px 0;
        }

        .report-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .report-label {
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(147, 112, 219, 0.8);
            margin-bottom: 12px;
        }

        .report-type-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .picasso-art {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .picasso-art svg {
            width: 100%;
            height: 100%;
        }

        .report-type {
            font-size: 32px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 2px;
        }

        .report-subtitle {
            color: rgba(255, 255, 255, 0.55);
            font-size: 15px;
            line-height: 1.6;
        }

        /* Glass Cards */
        .glass-section {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 32px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15), inset 0 1px 1px var(--glass-shine);
            overflow: hidden;
        }

        .glass-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
            pointer-events: none;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            font-size: 20px;
        }

        .section-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            line-height: 1.7;
        }

        /* Radar Chart */
        .radar-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .radar-canvas {
            border-radius: 50%;
        }

        /* Dimension List */
        .dimension-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .dimension-tag {
            background: rgba(147, 112, 219, 0.15);
            border: 1px solid rgba(147, 112, 219, 0.3);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Match Grid */
        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        .match-type {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 6px;
        }

        .match-percent {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #9370db, #db7093);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Share Section */
        .share-section {
            text-align: center;
            margin-top: 10px;
        }

        .btn-share {
            background: linear-gradient(135deg, #40e0d0, #9370db);
            margin-bottom: 16px;
        }

        .btn-share:hover {
            box-shadow: 0 12px 40px rgba(64, 224, 208, 0.4);
        }

        .retake-link {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .retake-link:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        /* Animations */
        .animate-slide-up {
            animation: slideUp 0.6s ease both;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }
        .delay-6 { animation-delay: 0.6s; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="flow-bg">
        <div class="flow-gradient"></div>
        <div class="flow-blob blob-1"></div>
        <div class="flow-blob blob-2"></div>
        <div class="flow-blob blob-3"></div>
        <div class="flow-blob blob-4"></div>
        <div class="flow-blob blob-5"></div>
    </div>

    <div class="container">
        <!-- Welcome Screen -->
        <div id="screen-welcome" class="screen active">
            <div class="welcome-container">
                <div class="title-container">
                    <div class="logo">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#fff"/>
                                    <stop offset="100%" style="stop-color:rgba(255,255,255,0.6)"/>
                                </linearGradient>
                            </defs>
                            <circle cx="50" cy="40" r="25" fill="url(#logoGrad)" opacity="0.9"/>
                            <ellipse cx="42" cy="38" rx="6" ry="8" fill="#1a1a1e"/>
                            <ellipse cx="58" cy="38" rx="6" ry="8" fill="#1a1a1e"/>
                            <path d="M40 55 Q50 62 60 55" stroke="#1a1a1e" stroke-width="2" fill="none"/>
                            <path d="M30 20 Q50 5 70 20" stroke="url(#logoGrad)" stroke-width="3" fill="none"/>
                            <circle cx="35" cy="28" r="4" fill="#9370db" opacity="0.7"/>
                            <circle cx="65" cy="28" r="4" fill="#db7093" opacity="0.7"/>
                        </svg>
                    </div>
                    <h1 class="main-title">DSBTI</h1>
                    <p class="subtitle">DIGITAL SOUL BASELINE TEST</p>
                </div>
                <p class="intro-text">
                    你的數位靈魂即將被捕捉。<br>
                    28個維度的信號即將展開。<br>
                    準備好面對真實的自己了吗？
                </p>
                <button class="btn" onclick="startQuiz()">▶ 啟動採樣</button>
            </div>
        </div>

        <!-- Destination Screen -->
        <div id="screen-destination" class="screen">
            <div class="destination-container">
                <h2 class="destination-title">你的人生終點在哪裡？</h2>
                <div class="dest-grid">
                    <div class="dest-card" onclick="selectDestination('heaven')">
                        <div class="dest-icon">☁️</div>
                        <div class="dest-name">快樂天堂</div>
                        <div class="dest-desc">每天都是週末</div>
                    </div>
                    <div class="dest-card" onclick="selectDestination('hell')">
                        <div class="dest-icon">🔥</div>
                        <div class="dest-name">搞錢地獄</div>
                        <div class="dest-desc">鈔票堆積如山</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Question Screen -->
        <div id="screen-question" class="screen">
            <div class="question-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="question-meta">
                    <div class="question-number" id="questionNumber">問題 1 / 28</div>
                    <div class="question-emoji" id="questionEmoji">🧻</div>
                </div>
                <div class="question-text" id="questionText">載入中...</div>
                <div class="options" id="optionsContainer"></div>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="screen-loading" class="screen">
            <div class="loading-container">
                <div class="loading-orb-container">
                    <div class="loading-core"></div>
                    <div class="loading-ring"></div>
                    <div class="loading-ring"></div>
                    <div class="loading-ring"></div>
                </div>
                <div class="loading-text">靈魂解析中</div>
                <div class="loading-status" id="loadingStatus">正在掃描神經網絡...</div>
            </div>
        </div>

        <!-- Report Screen -->
        <div id="screen-report" class="screen">
            <div class="report-container">
                <div class="report-header animate-slide-up delay-1">
                    <div class="report-label">YOUR SOUL TYPE</div>
                    <div class="report-type-container">
                        <div class="picasso-art" id="picassoArt"></div>
                        <div class="report-type" id="reportType">載入中...</div>
                    </div>
                    <div class="report-subtitle" id="reportSubtitle"></div>
                </div>

                <div class="glass-section animate-slide-up delay-2">
                    <div class="section-title">
                        <span class="section-icon">🎯</span>
                        維度分析
                    </div>
                    <div class="radar-container">
                        <canvas id="radarChart" class="radar-canvas" width="300" height="300"></canvas>
                    </div>
                </div>

                <div class="glass-section animate-slide-up delay-3">
                    <div class="section-title">
                        <span class="section-icon">📊</span>
                        特質標籤
                    </div>
                    <div class="dimension-list" id="dimensionList"></div>
                </div>

                <div class="glass-section animate-slide-up delay-4">
                    <div class="section-title">
                        <span class="section-icon">💫</span>
                        靈魂解讀
                    </div>
                    <div class="section-text" id="soulDescription"></div>
                </div>

                <div class="glass-section animate-slide-up delay-5">
                    <div class="section-title">
                        <span class="section-icon">🎯</span>

        // ============ Navigation ============

        function showQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('questionNumber').textContent = `問題 ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('questionEmoji').textContent = q.emoji;
            document.getElementById('questionText').textContent = q.text;
            
            const progress = (currentQuestion / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <span class="option-letter">${letters[i]}</span>
                    <span class="option-text">${opt.text}</span>
                `;
                btn.onclick = () => selectOption(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(option, btn) {
            // Record answer
            answers.push(option.types);
            
            // Add type scores
            for (let type in option.types) {
                if (typeScores.hasOwnProperty(type)) {
                    typeScores[type] += option.types[type];
                }
            }
            
            // Visual feedback
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            
            // Next question after short delay
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    showQuestion();
                } else {
                    calculateAndShowResult();
                }
            }, 400);
        }

        // ============ Radar Chart ============
        function drawRadarChart() {
            const canvas = document.getElementById('radarChart');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = 300 * dpr;
            canvas.height = 300 * dpr;
            canvas.style.width = '300px';
            canvas.style.height = '300px';
            ctx.scale(dpr, dpr);
            
            const centerX = 150;
            const centerY = 150;
            const maxRadius = 110;
            const labels = ["奇葩", "焦虑", "社死", "emo", "摸鱼"];
            const levels = 5;
            
            // Draw background circles
            for (let i = 1; i <= levels; i++) {
                ctx.beginPath();
                const r = (maxRadius / levels) * i;
                for (let j = 0; j <= labels.length; j++) {
                    const angle = (Math.PI * 2 / labels.length) * j - Math.PI / 2;
                    const x = centerX + r * Math.cos(angle);
                    const y = centerY + r * Math.sin(angle);
                    if (j === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            // Draw axes
            for (let i = 0; i < labels.length; i++) {
                const angle = (Math.PI * 2 / labels.length) * i - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + maxRadius * Math.cos(angle), centerY + maxRadius * Math.sin(angle));
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            // Draw labels
            ctx.font = '12px "Noto Sans SC", sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.textAlign = 'center';
            for (let i = 0; i < labels.length; i++) {
                const angle = (Math.PI * 2 / labels.length) * i - Math.PI / 2;
                const x = centerX + (maxRadius + 20) * Math.cos(angle);
                const y = centerY + (maxRadius + 20) * Math.sin(angle);
                ctx.fillText(labels[i], x, y + 4);
            }
            
            // Draw data - generate based on type scores for variety
            const data = [];
            const types = Object.keys(typeScores);
            const values = Object.values(typeScores);
            const maxVal = Math.max(...values);
            
            for (let i = 0; i < 5; i++) {
                const idx = Math.floor(i * types.length / 5);
                data.push((typeScores[types[idx]] || 0) / maxVal);
            }
            
            ctx.beginPath();
            for (let i = 0; i <= labels.length; i++) {
                const idx = i % labels.length;
                const r = maxRadius * data[idx];
                const angle = (Math.PI * 2 / labels.length) * idx - Math.PI / 2;
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            
            const gradient = ctx.createLinearGradient(0, 0, 300, 300);
            gradient.addColorStop(0, 'rgba(147, 112, 219, 0.6)');
            gradient.addColorStop(1, 'rgba(219, 112, 147, 0.6)');
            ctx.fillStyle = gradient;
            ctx.fill();
            
            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        }

            const type = document.getElementById('reportType').textContent;
            const text = `我的DSBTI靈魂類型是：${type}\n\n快來測測你的靈魂類型 👇\n${window.location.href}`;
            
            if (navigator.share) {
                navigator.share({ text });
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(text);
                alert('已複製到剪貼簿！');
            }
        }

        function retakeQuiz() {
            destination = null;
            currentQuestion = 0;
            answers = [];
            init();
            goToScreen('welcome');
        }
    </script>
