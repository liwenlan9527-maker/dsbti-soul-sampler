<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>DSBTI | 数字灵魂采样</title>

<style>
:root {
  --bg: #fafafa;
  --fg: #1a1a1a;
  --muted: #888;
  --accent: #1a1a1a;
  --border: rgba(0,0,0,0.08);
  --card: #ffffff;
  --glow: rgba(0,0,0,0.03);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body, html {
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Serif SC", serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* 纹理背景 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    radial-gradient(circle at 20% 80%, rgba(0,0,0,0.015) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(0,0,0,0.02) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0.01) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 80px 40px;
  display: flex;
  flex-direction: column;
  opacity: 0;
  animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* 顶部标记 */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 60px;
}

.brand {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
}

.progress-text {
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* 进度条 */
.progress-wrap {
  margin-bottom: 50px;
}

.progress {
  height: 1px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: var(--fg);
  transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.progress-glow {
  position: absolute;
  right: 0;
  top: -2px;
  width: 6px;
  height: 5px;
  background: var(--fg);
  border-radius: 50%;
  filter: blur(3px);
  opacity: 0;
  transition: opacity 0.3s;
}

.bar:not(:empty) .progress-glow {
  opacity: 1;
}

/* 问题区域 */
.question-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.question {
  font-size: 22px;
  line-height: 1.8;
  font-weight: 400;
  font-family: "Noto Serif SC", serif;
  letter-spacing: 0.02em;
  margin-bottom: 60px;
}

/* 选项 */
.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option {
  padding: 20px 24px;
  border: none;
  border-radius: 0;
  background: transparent;
  color: var(--fg);
  font-size: 15px;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  position: relative;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  letter-spacing: 0.01em;
}

.option::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 100%;
  background: var(--fg);
  transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.option span {
  position: relative;
  z-index: 1;
  display: block;
  padding-left: 20px;
  border-left: 1px solid var(--border);
  transition: all 0.3s;
}

.option:hover span {
  border-color: var(--fg);
  padding-left: 28px;
}

.option:active {
  transform: scale(0.98);
}

.option:active::before {
  width: 100%;
}

.option:active span {
  color: #fff;
  border-color: transparent;
}

.start {
  text-align: center;
}

.start span {
  border: none;
  padding: 0;
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.start:hover span {
  padding: 0;
}

/* 结果页 */
#result {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 100;
  display: none;
  flex-direction: column;
  opacity: 0;
}

#result.show {
  display: flex;
  animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.result-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 60px 40px;
  max-width: 680px;
  margin: 0 auto;
  width: 100%;
}

/* 结果图标 */
.icon-container {
  position: relative;
  margin-bottom: 50px;
}

.icon-ring {
  width: 120px;
  height: 120px;
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.icon-ring::before {
  content: '';
  position: absolute;
  inset: -20px;
  border: 1px solid var(--border);
  border-radius: 50%;
  opacity: 0.5;
}

.icon-ring::after {
  content: '';
  position: absolute;
  inset: -40px;
  border: 1px solid var(--border);
  border-radius: 50%;
  opacity: 0.25;
}

.icon {
  width: 50px;
  height: 50px;
  opacity: 0;
  animation: iconFade 0.6s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes iconFade {
  to { opacity: 1; }
}

/* 类型标签 */
.type-label {
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 16px;
  opacity: 0;
  animation: slideUp 0.6s 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* 标题 */
.title {
  font-size: 36px;
  font-weight: 600;
  font-family: "Noto Serif SC", serif;
  letter-spacing: 0.05em;
  margin-bottom: 30px;
  opacity: 0;
  animation: slideUp 0.6s 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* 描述 */
.desc-container {
  max-width: 400px;
  text-align: center;
  opacity: 0;
  animation: slideUp 0.6s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.desc {
  font-size: 15px;
  line-height: 2;
  color: #555;
  font-family: "Noto Serif SC", serif;
  letter-spacing: 0.02em;
}

/* 底部操作 */
.result-footer {
  padding: 40px;
  text-align: center;
  opacity: 0;
  animation: slideUp 0.6s 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.share-btn {
  padding: 18px 48px;
  background: var(--fg);
  color: var(--bg);
  border: none;
  font-size: 12px;
  font-family: inherit;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s;
}

.share-btn:hover {
  background: #333;
}

.retake-btn {
  display: block;
  margin: 20px auto 0;
  padding: 12px 24px;
  background: transparent;
  color: var(--muted);
  border: none;
  font-size: 11px;
  font-family: inherit;
  letter-spacing: 1px;
  cursor: pointer;
  transition: color 0.3s;
}

.retake-btn:hover {
  color: var(--fg);
}

/* Logo */
.logo {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  opacity: 0.5;
}

/* 图片预览弹窗 */
#preview {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 200;
  flex-direction: column;
  padding: 40px;
}

#preview.show {
  display: flex;
}

#preview-img {
  max-width: 90%;
  max-height: 70vh;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}

.preview-tip {
  color: #666;
  margin-top: 30px;
  font-size: 12px;
  letter-spacing: 1px;
}

.close-preview {
  margin-top: 20px;
  padding: 14px 36px;
  background: transparent;
  color: #888;
  border: 1px solid #333;
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all 0.3s;
}

.close-preview:hover {
  color: #fff;
  border-color: #666;
}

/* 响应式 */
@media (max-width: 480px) {
  #app, .result-content {
    padding: 60px 28px;
  }
  .question {
    font-size: 19px;
  }
  .title {
    font-size: 28px;
  }
  .option {
    padding: 18px 20px;
  }
}
</style>
</head>

function render() {
  const q = questions[current]
  document.getElementById('progress-text').innerText = `${current+1}/${total}`
  document.getElementById('question').innerText = q.q
  document.getElementById('bar').style.width = ((current+1)/total*100) + '%'
  document.getElementById('options').innerHTML = `
<button class="option" onclick="ans('A')"><span>A. ${q.a}</span></button>
<button class="option" onclick="ans('B')"><span>B. ${q.b}</span></button>
<button class="option" onclick="ans('C')"><span>C. ${q.c}</span></button>
<button class="option" onclick="ans('D')"><span>D. ${q.d}</span></button>
  `
}

function ans(t) {
  score[t]++
  current++
  if (current >= total) {
    showResult()
    return
  }
  render()
}

function showResult() {
  const top = Object.keys(score).reduce((a,b)=>score[a]>score[b]?a:b)
  const list = personas.filter(x=>x.t==top)
  const res = list[Math.floor(Math.random()*list.length)]
  
  document.getElementById('icon').innerHTML = `<path d="${icons[res.n]}"/>`
  document.getElementById('type-tag').innerText = typeNames[top]
  document.getElementById('title').innerText = res.n
  document.getElementById('desc').innerText = res.d
  document.getElementById('result').classList.add('show')
}

function start() {
  render()
}

// 生成分享卡片
async function generateCard() {
  const resultContent = document.querySelector('.result-content')
  const canvas = await html2canvas(resultContent, {
    backgroundColor: '#fafafa',
    scale: 2,
    useCORS: true,
    logging: false
  })
  const imgUrl = canvas.toDataURL('image/png')
  document.getElementById('preview-img').src = imgUrl
  document.getElementById('preview').classList.add('show')
}
