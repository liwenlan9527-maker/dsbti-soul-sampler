<head>

<title>DSBTI | 数字灵魂采样</title>

<style>
:root {
  --bg: #fafafa;
  --fg: #1a1a1a;
  --muted: #888;
  --accent: #1a1a1a;
  --border: rgba(0,0,0,0.08);
  --card: #ffffff;
  --glow: rgba(0,0,0,0.03);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body, html {
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Serif SC", serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    radial-gradient(circle at 20% 80%, rgba(0,0,0,0.015) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(0,0,0,0.02) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0.01) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 80px 40px;
  display: flex;
  flex-direction: column;
  opacity: 0;
  animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 60px;
}

.brand {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
}

.progress-text {
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.progress-wrap {
  margin-bottom: 50px;
}

.progress {
  height: 1px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: var(--fg);
  transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.progress-glow {
  position: absolute;
  right: 0;
  top: -2px;
  width: 6px;
  height: 5px;
  background: var(--fg);
  border-radius: 50%;
  filter: blur(3px);
  opacity: 0;
  transition: opacity 0.3s;
}

.bar:not(:empty) .progress-glow {
  opacity: 1;
}

.question-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.question {
  font-size: 22px;
  line-height: 1.8;
  font-weight: 400;
  font-family: "Noto Serif SC", serif;
  letter-spacing: 0.02em;
  margin-bottom: 60px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option {
  padding: 20px 24px;
  border: none;
  border-radius: 0;
  background: transparent;
  color: var(--fg);
  font-size: 15px;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  position: relative;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  letter-spacing: 0.01em;
}

.option::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 100%;
  background: var(--fg);
  transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.option span {
  position: relative;
  z-index: 1;
  display: block;
  padding-left: 20px;
  border-left: 1px solid var(--border);
  transition: all 0.3s;
}

.option:hover span {
  border-color: var(--fg);
  padding-left: 28px;
}

.option:active {
  transform: scale(0.98);
}

.option:active::before {
  width: 100%;
}

.option:active span {
  color: #fff;
  border-color: transparent;
}

.start {
  text-align: center;
}

.start span {
  border: none;
  padding: 0;
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.start:hover span {
  padding: 0;
}

#result {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 100;
  display: none;
  flex-direction: column;
  opacity: 0;
}

#result.show {
  display: flex;
  animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.result-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 60px 40px;
  max-width: 680px;
  margin: 0 auto;
  width: 100%;
}

.icon-container {
  position: relative;
  margin-bottom: 50px;
}

.icon-ring {
  width: 120px;
  height: 120px;
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.icon-ring::before {
  content: '';
  position: absolute;
  inset: -20px;
  border: 1px solid var(--border);
  border-radius: 50%;
  opacity: 0.5;
}

.icon-ring::after {
  content: '';
  position: absolute;
  inset: -40px;
  border: 1px solid var(--border);
  border-radius: 50%;
  opacity: 0.25;
}

.icon {
  width: 50px;
  height: 50px;
  opacity: 0;
  animation: iconFade 0.6s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes iconFade {
  to { opacity: 1; }
}

.type-label {
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 16px;
  opacity: 0;
  animation: slideUp 0.6s 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.title {
  font-size: 36px;
  font-weight: 600;
  font-family: "Noto Serif SC", serif;
  letter-spacing: 0.05em;
  margin-bottom: 30px;
  opacity: 0;
  animation: slideUp 0.6s 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.desc-container {
  max-width: 420px;
  text-align: center;
  opacity: 0;
  animation: slideUp 0.6s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.desc {
  font-size: 15px;
  line-height: 2.2;
  color: #555;
  font-family: "Noto Serif SC", serif;
  letter-spacing: 0.02em;
}

.result-footer {
  padding: 40px;
  text-align: center;
  opacity: 0;
  animation: slideUp 0.6s 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.share-btn {
  padding: 18px 48px;
  background: var(--fg);
  color: var(--bg);
  border: none;
  font-size: 12px;
  font-family: inherit;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s;
}

.share-btn:hover {
  background: #333;
}

.retake-btn {
  display: block;
  margin: 20px auto 0;
  padding: 12px 24px;
  background: transparent;
  color: var(--muted);
  border: none;
  font-size: 11px;
  font-family: inherit;
  letter-spacing: 1px;
  cursor: pointer;
  transition: color 0.3s;
}

.retake-btn:hover {
  color: var(--fg);
}

.logo {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  opacity: 0.5;
}

#preview {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 200;
  flex-direction: column;
  padding: 40px;
}

#preview.show {
  display: flex;
}

#preview-img {
  max-width: 90%;
  max-height: 70vh;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}

.preview-tip {
  color: #666;
  margin-top: 30px;
  font-size: 12px;
  letter-spacing: 1px;
}

.close-preview {
  margin-top: 20px;
  padding: 14px 36px;
  background: transparent;
  color: #888;
  border: 1px solid #333;
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all 0.3s;
}

.close-preview:hover {
  color: #fff;
  border-color: #666;
}

@media (max-width: 480px) {
  #app, .result-content {
    padding: 60px 28px;
  }
  .question {
    font-size: 19px;
  }
  .title {
    font-size: 28px;
  }
  .option {
    padding: 18px 20px;
  }
  .desc-container {
    max-width: 100%;
  }
}
</style>
</head>

const personas = [
{n:"零度协议",d:"你大概是那种，在任何场合都能让人安心的存在吧。不是因为你说的话有多动听，而是因为你的存在本身就是一种稳定剂——混乱的时候，你是那个不会慌的人；崩溃的时候，你是那个还在运转的人。别人可能觉得你是「天生强大」，但我知道，这份冷静是你对自己严格要求的结果。\n\n你不是一个没有感情的人，恰恰相反——正因为你感受得太深，你才学会了如何不让情绪失控。这是你保护自己的方式，也是保护别人的方式。你习惯把所有东西都整理得井井有条，因为只有这样，你才觉得一切还在掌控之中。\n\n你不太会主动表达脆弱，因为你不确定对方能不能接住。但正因为如此，当有人真的走进你的世界，你会发现你是一个无比忠诚的朋友——那种「你掉下去我会接住你」的人。",t:"A"},
{n:"静默核心",d:"你大概从小就比同龄人更懂得「边界」这个词的意义吧。不是没有人情味，而是你比任何人都清楚，不是所有人都值得了解真实的你。\n\n你有一种天赋：让人觉得被你接纳了，但同时又保持着恰到好处的距离。这不是冷漠，这是一门艺术。大多数人只见过你精心呈现的那一面——得体、适度、滴水不漏。但只有极少数人知道，在那之后藏着一个多有趣、多复杂的灵魂。\n\n你很少主动打开自己，因为你觉得「被打扰」是一件很麻烦的事。但一旦你认定一个人，你会是那种会在凌晨三点接电话的人，会是那种记得所有小细节的人。你只是不说，你只是在做。这大概是你表达爱意的方式——安静而确定。",t:"A"},
{n:"幽灵档案",d:"你有没有发现，自己总是那个「旁观者」？不是刻意疏离，而是你天然就有一种抽离的能力——置身其中，却又能跳出来看全局。这种能力让你成为了最好的倾听者，因为你在听的时候，真的只是在「听」，而不是急着给建议或者反驳。\n\n你记录很多东西，脑子里装着很多细节。别人的一句话、一个表情、一个选择，你都会默默记下。也许你自己都没意识到，这种习惯让你成了朋友中那个「被需要时总会出现」的人。\n\n你不太会主动发起社交，但你的存在感又很强——因为当别人需要有人「稳稳地接住」他们的时候，第一个想到的就是你。这份被需要的感觉，是你虽然嘴上不说，但心里其实很珍视的。",t:"A"},
{n:"光导神经",d:"你大概是那种，让人觉得「和ta说话很舒服」的人吧。不是因为你多会聊天，而是因为你从来不制造噪音。不八卦，不评判，不制造尴尬。你只传递真正有用的信息，这种简洁反而让人觉得被尊重。\n\n你有一种罕见的能力：把复杂的事情说简单。在这个充斥着废话和废话文学的时代，你的存在就像一股清流。你说话不绕弯子，做事讲究效率，讨厌一切形式主义——这些特点可能让你显得有些「冷」，但了解你的人都知道，你只是不屑于浪费时间。\n\n你可能不太习惯表达情感，觉得说出来太矫情。但你会在行动上表达——帮朋友查一份资料，提醒同事一个遗漏的细节。你的好，从来都是润物细无声的。",t:"A"},
{n:"精密校准仪",d:"你大概从很小的时候就被说「要求太高」吧。不是你不合群，而是你真的很难接受「差不多就行」。一道题没解出来，你会睡不着；一封邮件有错字，你会反复检查三遍；一个计划有漏洞，你会焦虑到重新推翻重来。\n\n别人觉得你累，但只有你自己知道，你不这样做会更难受。那种「差一点」的感觉，像指甲划过黑板，会在你脑子里循环播放。你不是在追求完美，你是在逃避「不够好」带来的羞耻感。\n\n但我想告诉你：你对自己苛刻，不是缺点，是你的超能力。正是因为你不肯将就，所以你做的东西总是比预期好一点。正是因为你总在审视自己，所以你在别人眼里总是「比实际更靠谱」。这不是压力，这是你的天赋。",t:"A"},
{n:"加密内核",d:"你有没有被人说过「很难懂」？不是因为你故作神秘，而是因为你确实不是那种一眼就能看透的人。你的每一层壳都是有原因的——保护自己，也保护真正重要的人。\n\n你很挑。不是挑剔，是挑剔。不喜欢泛泛之交，不喜欢走形式的社交，不喜欢「在吗」「吃了没」这种废话。你的时间是珍贵的，所以你会把社交按优先级排列。这让一些人觉得你「高冷」，但了解你的人知道，你只是不愿意把精力浪费在不值得的人身上。\n\n一旦你决定信任一个人，你会把自己完全交出去。你不太会试探、不太会考验，要么不信任，要么就是全情投入。这种「要么全有要么全无」的方式，让你的人际关系虽然数量不多，但质量极高。",t:"A"},
{n:"极光哨站",d:"你有没有觉得，自己比大多数人更容易被细节打动？一部电影里一个无关紧要的镜头，一首歌里一句歌词，一个陌生人脸上的表情……这些别人一扫而过的东西，却会在你心里停留很久。\n\n这种敏感有时候是负担，因为它让你比常人更容易感到疲惫。嘈杂的环境、密集的人群、强烈的情绪……都会让你想逃。但正是这种敏感，让你成为那种「能注意到别人忽略的东西」的人。\n\n你可能不擅长社交场合的寒暄，但一对一聊天的时候，你的那种认真倾听和回应，会让人有种「被真正看见」的感觉。你可能不会说很多安慰的话，但你的陪伴本身就是一种安慰。",t:"A"},
{n:"空转引擎",d:"你有没有那种感觉——明明一天什么都没做，却累得要死？那是因为你的消耗大部分都是「内部消耗」。脑子里转个不停，担忧这个焦虑那个，一个念头接着一个念头，像一台空转的引擎——一直在转，但不产生任何向前的动力。\n\n你可能对自己的「低效率」感到愧疚，觉得自己懒、消极、不上进。但这不是真的。你只是那种需要更多时间「热身」的人。你不是不想做，你是需要先把内在的噪音处理干净，才能轻装上阵。\n\n给自己一点时间。你那些看似无意义的「空转」，其实是你在整合、在思考、在为真正重要的事情做准备。当你真的开始行动的时候，你会发现自己的专注力比任何人都强。",t:"B"},
{n:"深海电台",d:"你有没有发现，自己总是那个被朋友当作「树洞」的人？不是什么神秘魅力，而是因为你有一种让人卸下防备的能力——你不会急着给建议，不会说「你想太多了」，你只是安静地听，偶尔问一个问题，让对方自己找到答案。\n\n你大概也习惯了在深夜独自消化情绪吧。白天的时候，你把自己的情绪管理得很好，好到很多人都以为你「没心没肺」「永远乐观」。但只有你自己知道，那些东西你都收起来了，收在只有深夜才会打开的地方。\n\n你有一种天赋：即使自己身处低谷，也能在朋友需要的时候成为避风港。这不是假装，这是一种很深沉的温柔——正因为你知道痛苦是什么感觉，所以你不想让别人经历同样的孤独。",t:"B"},
{n:"易碎频率",d:"你有没有被人说过「太敏感」？那种「你又多想了吧」「别那么在意」的善意提醒，有时候反而让你更难受。因为你是真的在意——不是玻璃心，是你真的能感受到别人感受不到的频率。\n\n这种敏感让你活得更累，但也活得更深刻。你能在一句话里听出三层意思，能在一个眼神里看到一段故事。这种能力让你成为了最好的朋友、最体贴的伴侣、最敏锐的观察者——只是代价是，你也会更容易受伤。\n\n但我想告诉你：你不是「太敏感」，你只是比多数人更勇敢——勇敢到愿意把心敞开，去感受那些脆弱的、容易刺痛的东西。这是你的天赋，不是你的弱点。",t:"B"},
{n:"低频呼吸",d:"你有没有发现，自己和这个世界的节奏不太一样？别人在冲刺的时候，你在漫步；别人在焦虑的时候，你在发呆；别人在刷短视频的时候，你在盯着窗外看云。这种「慢」有时候让你和周围格格不入。\n\n但正是这种慢，让你能看到别人看不到的东西。当你放慢脚步，你开始注意到阳光在树叶上移动的方式，开始注意到咖啡的香气在空气里扩散的方式。你的人生没有别人那么「丰富」，但你的体验比多数人更深刻。\n\n你可能经常被催「快点」「效率高一点」，但只有你自己知道，你不是慢，你是在选择用什么样的方式度过时间。这不是逃避，这是一种主动的选择。",t:"B"},
{n:"失重漂流",d:"你有没有觉得自己像一粒悬浮的尘埃？在这个到处都是「圈子」「人脉」「资源整合」的世界里，你好像和这些概念都没什么关系。你不混圈子，不搞关系，不刻意维护任何东西。\n\n这让你有时候感到孤独——不是没人陪的那种孤独，是「找不到同类」的孤独。但这种孤独也给了你一种自由：你不需要为任何人表演，不需要维持任何人设，不需要假装对什么感兴趣。你是你自己，唯一版本的你。\n\n你可能不擅长社交场合的即兴发挥，但在一对一的关系里，你的深度是很多人达不到的。你能和人进行那种「凌晨三点的对话」，谈一些真正重要的事情。这种连接，一个就够了。",t:"B"},
{n:"过热核心",d:"你有没有那种「已经到极限了」的感觉？明明已经很累了，但事情还是一件接一件，于是你继续撑着，告诉自己「撑完这阵子就好了」。然后撑完了这件事，又来了一件新的。\n\n你大概一直在承担很多吧。不是因为你有多厉害，而是因为你不会拒绝，因为你不想让别人失望，因为你觉得自己不做就没人做了。这种「被需要」的感觉让你有存在感，但也在慢慢消耗你。\n\n我想告诉你：你不需要通过「有用」来证明自己的价值。你不需要让所有人都满意。你已经做得够多了，你值得休息。不是自私，是必要——一个把自己累垮的人，没办法持续地帮助别人。",t:"B"},
{n:"旧磁带",d:"你有没有发现，自己总是那个「记得」的人？记得朋友随口说过的一句话，记得某年夏天的味道，记得那些已经过去很久的瞬间。不是刻意去记，而是你就是那种会把一切都收进记忆的人。\n\n在这个人人都在喊「向前看」「别回头」「放下过去向前走」的时代，你选择不那么做。你会反复听一首老歌，重看一部旧电影，在朋友圈发一张很久以前的照片。你知道这样看起来有点「活在过去」，但那些东西对你来说不是负担，是宝藏。\n\n你是一个有纵深的人。不像那种单薄的一眼看穿的人，你像一本有很多章节的书，每一页都有东西可以读。你怀旧，但不是因为逃避现实，而是因为你知道，正是那些过去的事情，塑造了现在这个独一无二的你。",t:"B"},
{n:"引力奇点",d:"你有没有发现，不管你愿不愿意，你总是处在某个圈子的中心？不是你刻意表现，而是你身上有某种东西，让人不自觉地想靠近——可能是气场，可能是能量，也可能是你身上那种「知道自己是谁」的笃定。\n\n你有那种让人「服气」的能力。不是因为你多权威，而是因为你身上有一种内在的力量，让人在你面前不太会虚张声势。这不是强势，这是一种让人安心的稳定感。\n\n你大概习惯了被依赖吧。朋友做决定的时候会找你，同事遇到问题会问你，家人遇到事情会听你的。这种被需要的感觉很好，但有时候也会累——因为你也会累，也会有脆弱的时候，也需要有人能让你靠一靠。",t:"C"},
{n:"信号枢纽",d:"你有没有发现，自己是那种「没有你就转不动」的人？办公室的群聊里，你是那个调节气氛的人；朋友聚会里，你是那个串场的人；团队项目里，你是那个协调各方的人。你从来不主动邀功，但到处都有你的痕迹。\n\n你大概是那种「隐形核心」吧。不是名义上的领导，但做着实际上最关键的连接工作。没有你，信息就断掉了；没有你，默契就没有了。你是一张网的那个节点，所有线都汇聚在你这里。\n\n这种角色很累，因为你的贡献经常被忽视。大家记得的是那个站在台前的人，不太记得在幕后把一切串起来的人。但你知道自己的工作有多重要——这就够了。",t:"C"},
{n:"共振风暴",d:"你有没有那种感觉——你到一个地方，那个地方的气氛就会因为你而改变？低落的时候，你能带动氛围；沉默的时候，你能打破僵局；无聊的时候，你能制造话题。你可能自己都没意识到，但你身上确实有一种「影响力」。\n\n你有感染力。不是那种张扬的、强行推销的感染力，而是那种润物细无声的——你一笑，周围人就跟着放松了；你认真起来，周围人就跟着严肃了。这种能力是天生的，很难学。\n\n你可能有时候会困惑：为什么别人的情绪那么容易影响到你？后来你明白了，不是因为你脆弱，而是因为你太能「共振」了——你能感受到别人感受到的东西，然后放大它、回应它。这是你的天赋，用好了，你能成为任何场合的气氛制造者。",t:"C"},
{n:"高压电容",d:"你有没有被人说过「气场很强」？那种第一眼就让人感到「这个人不好惹」的气场。这不是装出来的，是你内在的力量感投射到外面的结果。你有自己的原则，有自己的底线，有自己明确的喜好和厌恶。\n\n你大概经常被当作「狠角色」吧。不是那种欺负人的狠，是那种「不好糊弄」的狠。你能一眼看穿别人的小心思，能在谈判里稳稳地占据主动，能在任何场合保持体面和掌控感。\n\n但只有极少数人知道，你的那份「强硬」背后，其实藏着一种渴望——渴望被人真正理解，渴望有一个可以卸下铠甲的地方。你的外壳很硬，但里面是柔软的。这份反差，是你最有魅力的一部分。",t:"C"},
{n:"霓虹幻影",d:"你有没有发现，自己很擅长「呈现」？不是虚伪，而是一种对形象的掌控力——知道在什么场合穿什么，说什么，怎么表现。你是那种「永远得体」的人，在任何社交场合都不会让人失望。\n\n你大概是那种「看起来毫不费力」的人吧。但只有你自己知道，每一次的「毫不费力」背后有多少准备和练习。你会提前想好要说什么，会注意观察别人的反应，会调整自己的状态来适应场合。\n\n这种能力是你的竞争优势。在这个「呈现」变得越来越重要的时代，你的自我管理能力让你在任何场合都能脱颖而出。你知道如何让人们记住你，如何留下印象。这是本事，不是缺点。",t:"C"},
{n:"加速燃烧",d:"你有没有那种根本停不下来的感觉？不是在表演忙碌，是真的停不下来——脑子一直在转，念头一个接一个，休息的时候反而更焦虑。你需要目标，需要进度，需要看到事情在向前推进。\n\n你大概是那种「卷王」吧。但你卷的对象不是别人，是你自己。你对自己永远不满意，永远觉得还能更好，永远觉得不能松懈。这让你很累，但也让你一直在进步。\n\n别人可能觉得你太拼了，不懂得享受。但只有你自己知道，停下来才更可怕——因为一旦停下来，那些焦虑和恐惧就会涌上来。你用奔跑来逃避静止，用忙碌来逃避空虚。这没什么不好，但记得偶尔也要照顾一下那个疲惫的自己。",t:"C"},
{n:"永动闭环",d:"你是那种让人「放心」的存在吧。不是那种惊艳的、能带来惊喜的人，而是那种「交给你准没错」的人。你稳定、可靠、可预期，永远在那个位置上，永远能完成任务。\n\n你是团队里最不会被注意到的人之一，因为一切都进行得太顺利了——顺利到没人意识到这里面有多少你的付出。但一旦你不在，问题就会暴露出来。你是那种「缺失了才知道重要」的人。\n\n你对自己的「普通」可能有点不甘心，觉得自己好像没什么特别的。但请记住：在这个充满不确定性的世界里，「稳定」本身就是一种稀缺资源。你是让周围人安心的锚点，这是一份很重要的价值。",t:"C"},
{n:"混沌因子",d:"你有没有觉得自己和「正常人」有点不一样？不是坏的那种不一样，而是你的思维方式、你的反应、你看事情的角度，总是和别人有偏差。这种偏差有时候让你显得格格不入，有时候又让你显得特别有意思。\n\n你是那种「不按常理出牌」的人。在大家都往东走的时候，你偏偏往西看一眼；在大家都接受规则的时候，你偏偏问一句「为什么」。这种质疑精神有时候让你显得有点「杠」，但其实你只是不愿意盲从。\n\n你大概是那种让人「又爱又恨」的类型吧。爱你的有趣和独特，恨你的不配合和不服从。但真正的朋友知道，正是这种不随大流，让你成为了那个「总能提出新想法」的人。世界需要你这样的变量。",t:"D"},
{n:"幽灵协议",d:"你有没有觉得自己活得像一个「局外人」？明明身处人群，却感觉隔着一层玻璃。你在参与，但你没有真正投入；你在说话，但没有真正袒露。这种状态有时候让你感到自由，有时候又让你感到孤独。\n\n你是那种「选择性在场」的人。不是逃避社交，而是你主动选择了参与的程度。你知道什么时候该说话，什么时候该沉默，什么时候该靠近，什么时候该退后。这种边界感是你保护自己的方式，也是你保持自我的方式。\n\n你大概也习惯了「不被理解」吧。不是因为没人想理解，而是你的内在确实比多数人复杂。你想的东西、你感受的东西，可能很难用语言表达。这不是你的问题，是语言的局限。你只是比多数人更需要独处来和自己相处。",t:"D"},
{n:"边界渗透",d:"你有没有发现，自己不属于任何特定的「类型」？不是内向也不是外向，不是理性也不是感性，不左也不右。你像一个「无法分类」的存在，这让一些人困惑，但让你感到自由。\n\n你是那种「两边都能待」的人。在精英圈子里你不违和，在市井街边你也能混得开；能和学者聊学术，也能和工人聊生活。这种适应性让你看到了更多面的人生，也让更多人能在你这里找到共鸣。\n\n你大概经常被问「你到底在想什么」吧。这不是因为你故作神秘，而是你真的不太容易被人定义。你在不同的世界之间游走，但你真正属于的，是你自己创造的那个空间——那个不被任何标签限制的地方。",t:"D"},
{n:"空白画布",d:"你有没有那种「什么都不是」的感觉？不是谦卑，是真的觉得——我没有固定的人设，没有明确的标签，不知道自己算哪一类人。这种空白有时候让人焦虑，但也许，这恰恰是你最大的自由。\n\n你是那种「待定义」的人。不是还没定型，而是你选择不被定型。你不想被任何标签限制，不想被任何期待框住。你想保留随时重塑自己的权利。\n\n在这人人都急着给自己贴标签、立人设的时代，你的空白是一种反叛。你不是没有内容，你只是选择不急着呈现。这份耐心，这种「宁可留白也不将就」的态度，其实是一种难得的清醒。",t:"D"},
{n:"静默护盾",d:"你有没有发现，自己是那种「最后才被想到」的人？不是因为不重要，而是因为你太安静了，安静到大家都忘了你也会累、也需要关心。你总是那个照顾别人的人，但很少成为被照顾的那个。\n\n你是那种「不说」的人。累了不说，难受不说，委屈也不说。不是逞强，是你觉得说了也没用，或者不想给别人添麻烦。这种独自消化的习惯，让你成为一个非常坚强的人，但也让你比多数人更孤独。\n\n但我想告诉你：你的沉默不是软弱，你的退让不是懦弱。你只是比多数人更懂得——有些东西，说出来也改变不了什么，不如用行动去应对。你的安静，是你处理世界的方式，值得被尊重。",t:"D"},
{n:"暗物质井",d:"你有没有觉得，自己总是那个「接住别人情绪」的人？朋友倒苦水找你，同事抱怨找你，家人发脾气也找你。你像一个容器，接纳着各种负面的东西，然后默默消化掉。\n\n你是那种「沉」的人。不是沉闷，是沉。你不会随风飘，你不会被带节奏，你有一种内在的稳定性，让你在混乱中依然保持原样。这种沉重有时候让你觉得累，但它也是你最吸引人的地方——和你在一起，人们会感到一种奇怪的安心。\n\n你大概也习惯了「被需要」的感觉吧。某种程度上，你的存在价值感来自于「被需要」。但我想提醒你：你值得被照顾，就像你照顾别人一样。",t:"D"},
{n:"熵增观测者",d:"你有没有一种「清醒的悲观」？不是那种自怨自艾的悲观，而是那种「我知道事情会变糟，但我依然选择在场」的清醒。你能看到事物走向崩溃的必然，但不会因此就放弃生活。\n\n你是那种「看透了」的人。不是看破红尘的消极，而是看透之后的接受。你知道朋友圈的精致是表演，知道职场的人情世故是规则，知道大多数社交是无效的——但你依然选择参与其中，不是为了改变什么，是因为你知道这就是生活本来的样子。\n\n你大概也因为这种「清醒」而有点孤独吧。因为你不想向人解释「为什么你这么丧」，你也不想假装「一切都会好起来的」。你的真实有时候让你显得格格不入。但请保持这种真实——它比任何假装都更有力量。",t:"D"}
]

function render() {
  const q = questions[current]
  document.getElementById('progress-text').innerText = `${current+1}/${total}`
  document.getElementById('question').innerText = q.q
  document.getElementById('bar').style.width = ((current+1)/total*100) + '%'
  document.getElementById('options').innerHTML = `
<button class="option" onclick="ans('A')"><span>A. ${q.a}</span></button>
<button class="option" onclick="ans('B')"><span>B. ${q.b}</span></button>
<button class="option" onclick="ans('C')"><span>C. ${q.c}</span></button>
<button class="option" onclick="ans('D')"><span>D. ${q.d}</span></button>
  `
}

function ans(t) {
  score[t]++
  current++
  if (current >= total) {
    showResult()
    return
  }
  render()
}

function showResult() {
  const top = Object.keys(score).reduce((a,b)=>score[a]>score[b]?a:b)
  const list = personas.filter(x=>x.t==top)
  const res = list[Math.floor(Math.random()*list.length)]
  
  document.getElementById('icon').innerHTML = `<path d="${icons[res.n]}"/>`
  document.getElementById('type-tag').innerText = typeNames[top]
  document.getElementById('title').innerText = res.n
  document.getElementById('desc').innerText = res.d
  document.getElementById('result').classList.add('show')
}

function start() {
  render()
}

async function generateCard() {
  const resultContent = document.querySelector('.result-content')
  const canvas = await html2canvas(resultContent, {
    backgroundColor: '#fafafa',
    scale: 2,
    useCORS: true,
    logging: false
  })
  const imgUrl = canvas.toDataURL('image/png')
  document.getElementById('preview-img').src = imgUrl
  document.getElementById('preview').classList.add('show')
}
</script>
</body>
</html>
