<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DSBTI 灵魂采样系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shine: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #1a1a1e;
        }

        /* ========== 真正的流动彩色背景 ========== */
        .flow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: #1a1a1e;
            overflow: hidden;
        }

        .flow-gradient {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(147, 112, 219, 0.5) 0%, transparent 25%),
                radial-gradient(circle at 80% 20%, rgba(255, 182, 193, 0.4) 0%, transparent 25%),
                radial-gradient(circle at 40% 70%, rgba(64, 224, 208, 0.4) 0%, transparent 25%),
                radial-gradient(circle at 70% 80%, rgba(255, 218, 185, 0.45) 0%, transparent 25%),
                radial-gradient(circle at 50% 50%, rgba(176, 196, 222, 0.35) 0%, transparent 30%),
                radial-gradient(circle at 10% 90%, rgba(221, 160, 221, 0.4) 0%, transparent 20%),
                radial-gradient(circle at 90% 60%, rgba(255, 182, 193, 0.35) 0%, transparent 22%);
            animation: flowMove 30s ease-in-out infinite;
        }

        @keyframes flowMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5%, 3%) rotate(5deg); }
            50% { transform: translate(-3%, 5%) rotate(-3deg); }
            75% { transform: translate(-5%, -3%) rotate(3deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .flow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            mix-blend-mode: screen;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, rgba(147, 112, 219, 0.6), rgba(255, 182, 193, 0.4));
            top: -100px;
            left: -100px;
            animation: blob1 20s ease-in-out infinite;
        }

        .blob-2 {
            width: 600px;
            height: 600px;
            background: linear-gradient(225deg, rgba(64, 224, 208, 0.5), rgba(176, 196, 222, 0.4));
            top: 30%;
            right: -150px;
            animation: blob2 25s ease-in-out infinite;
        }

        .blob-3 {
            width: 450px;
            height: 450px;
            background: linear-gradient(315deg, rgba(255, 218, 185, 0.55), rgba(221, 160, 221, 0.4));
            bottom: -50px;
            left: 30%;
            animation: blob3 22s ease-in-out infinite;
        }

        .blob-4 {
            width: 350px;
            height: 350px;
            background: linear-gradient(45deg, rgba(255, 182, 193, 0.5), rgba(147, 112, 219, 0.35));
            top: 60%;
            left: 10%;
            animation: blob4 18s ease-in-out infinite;
        }

        .blob-5 {
            width: 400px;
            height: 400px;
            background: linear-gradient(180deg, rgba(64, 224, 208, 0.45), rgba(176, 196, 222, 0.35));
            top: 10%;
            right: 20%;
            animation: blob5 23s ease-in-out infinite;
        }

        @keyframes blob1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(150px, 100px) scale(1.2); }
            50% { transform: translate(80px, 200px) scale(0.9); }
            75% { transform: translate(-50px, 120px) scale(1.1); }
        }

        @keyframes blob2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-100px, 150px) rotate(20deg); }
            66% { transform: translate(-180px, 50px) rotate(-15deg); }
        }

        @keyframes blob3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            20% { transform: translate(100px, -80px) scale(1.15); }
            40% { transform: translate(200px, 50px) scale(0.85); }
            60% { transform: translate(120px, 100px) scale(1.1); }
            80% { transform: translate(50px, 60px) scale(1.05); }
        }

        @keyframes blob4 {
            0%, 100% { transform: translate(0, 0); }
            30% { transform: translate(80px, -60px); }
            60% { transform: translate(-60px, 80px); }
            90% { transform: translate(40px, 40px); }
        }

        @keyframes blob5 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-120px, 100px) scale(1.3); }
        }

        /* ========== Screen Container ========== */
        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 液态玻璃效果 ========== */
        .liquid-glass {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.2),
                inset 0 1px 1px var(--glass-shine);
            max-width: 480px;
            width: 100%;
            text-align: center;
            overflow: hidden;
        }

        .liquid-glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 100%);
            border-radius: 32px 32px 0 0;
            pointer-events: none;
        }

        .liquid-glass::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            right: 1px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            border-radius: 32px 32px 0 0;
            pointer-events: none;
        }

        .glass-content {
            position: relative;
            z-index: 1;
            padding: 48px 36px;
        }

        /* ========== Welcome Screen ========== */
        .welcome-icon {
            font-size: 72px;
            margin-bottom: 24px;
            animation: gentle-bounce 3s ease-in-out infinite;
        }

        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }

        .welcome-title {
            font-size: 30px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 16px;
            letter-spacing: 2px;
        }

        .welcome-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            line-height: 1.9;
            margin-bottom: 32px;
        }

        .welcome-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 36px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* ========== Buttons ========== */
        .btn {
            position: relative;
            background: linear-gradient(135deg, #9370db, #db7093);
            border: none;
            color: white;
            padding: 18px 48px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 20px rgba(147, 112, 219, 0.4);
            font-family: inherit;
            overflow: hidden;
            letter-spacing: 1px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(147, 112, 219, 0.5);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* ========== Heaven/Hell Choice ========== */
        .choice-container {
            position: relative;
            z-index: 1;
            padding: 48px 36px;
        }

        .choice-icon-top {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .choice-question {
            font-size: 24px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .choice-subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 40px;
        }

        .choice-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .choice-btn {
            position: relative;
            padding: 24px 32px;
            border-radius: 24px;
            border: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: inherit;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .heaven-btn {
            background: linear-gradient(135deg, rgba(147, 112, 219, 0.3), rgba(176, 196, 222, 0.3));
            border: 1px solid rgba(147, 112, 219, 0.4);
            color: white;
        }

        .heaven-btn:hover {
            background: linear-gradient(135deg, rgba(147, 112, 219, 0.5), rgba(176, 196, 222, 0.5));
            transform: translateX(10px);
            box-shadow: 0 8px 30px rgba(147, 112, 219, 0.3);
        }

        .hell-btn {
            background: linear-gradient(135deg, rgba(219, 112, 147, 0.3), rgba(255, 182, 193, 0.3));
            border: 1px solid rgba(219, 112, 147, 0.4);
            color: white;
        }

        .hell-btn:hover {
            background: linear-gradient(135deg, rgba(219, 112, 147, 0.5), rgba(255, 182, 193, 0.5));
            transform: translateX(10px);
            box-shadow: 0 8px 30px rgba(219, 112, 147, 0.3);
        }

        .choice-emoji {
            font-size: 36px;
        }

        .choice-text {
            text-align: left;
        }

        .choice-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .choice-desc {
            font-size: 13px;
            opacity: 0.7;
        }

        /* ========== Quiz Screen ========== */
        .quiz-header {
            width: 100%;
            max-width: 480px;
            margin-bottom: 24px;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            height: 6px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #9370db, #db7093, #ffd700);
            border-radius: 12px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .progress-current {
            color: rgba(147, 112, 219, 0.9);
            font-weight: 600;
        }

        .question-card {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 1px var(--glass-shine);
            overflow: hidden;
        }

        .question-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 100%);
            pointer-events: none;
        }

        .question-emoji {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 20px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-btn {
            position: relative;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 18px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: inherit;
            overflow: hidden;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(8px);
        }

        .option-btn.selected {
            background: linear-gradient(135deg, rgba(147, 112, 219, 0.3), rgba(219, 112, 147, 0.3));
            border-color: rgba(147, 112, 219, 0.5);
        }

        .option-letter {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .option-btn.selected .option-letter {
            background: linear-gradient(135deg, #9370db, #db7093);
            color: white;
            box-shadow: 0 4px 15px rgba(147, 112, 219, 0.4);
        }

        .option-text {
            color: rgba(255, 255, 255, 0.85);
            font-size: 15px;
            line-height: 1.5;
        }

        /* ========== Loading Screen ========== */
        .loading-container {
            text-align: center;
        }

        .loading-orb-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 40px;
        }

        .loading-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9370db, #db7093);
            animation: core-pulse 2s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(147, 112, 219, 0.5);
        }

        @keyframes core-pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        .loading-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(147, 112, 219, 0.6);
            animation: spin 2s linear infinite;
        }

        .loading-ring:nth-child(2) {
            top: 12px;
            left: 12px;
            width: calc(100% - 24px);
            height: calc(100% - 24px);
            border-top-color: rgba(219, 112, 147, 0.5);
            animation-duration: 2.5s;
            animation-direction: reverse;
        }

        .loading-ring:nth-child(3) {
            top: 24px;
            left: 24px;
            width: calc(100% - 48px);
            height: calc(100% - 48px);
            border-top-color: rgba(255, 218, 185, 0.4);
            animation-duration: 3s;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 20px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
        }

        .loading-status {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }

        /* ========== Report Screen ========== */
        .report-container {
            width: 100%;
            max-width: 560px;
            padding: 20px 0;
        }

        .report-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .report-label {
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(147, 112, 219, 0.8);
            margin-bottom: 12px;
        }

        .report-type-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .picasso-art {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .picasso-art svg {
            width: 100%;
            height: 100%;
        }

        .report-type {
            font-size: 32px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 2px;
        }

        .report-subtitle {
            color: rgba(255, 255, 255, 0.55);
            font-size: 15px;
            line-height: 1.6;
        }

        /* Glass Cards */
        .glass-section {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 32px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15), inset 0 1px 1px var(--glass-shine);
            overflow: hidden;
        }

        .glass-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
            pointer-events: none;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            font-size: 22px;
        }

        /* Radar Chart */
        .radar-container {
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            aspect-ratio: 1;
        }

        .dimension-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 24px;
        }

        .dim-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
        }

        .dim-name {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
        }

        .dim-bar-container {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .dim-bar {
            height: 100%;
            background: linear-gradient(90deg, #9370db, #db7093);
            border-radius: 2px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dim-value {
            font-size: 18px;
            font-weight: 600;
            color: rgba(147, 112, 219, 0.9);
        }

        /* Analysis Text */
        .analysis-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            line-height: 2;
        }

        /* Match Section */
        .match-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-top: 16px;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px 12px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .match-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-4px);
        }

        .match-picasso {
            width: 56px;
            height: 56px;
            margin: 0 auto 12px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        .match-picasso svg {
            width: 100%;
            height: 100%;
        }

        .match-type {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 6px;
        }

        .match-score {
            font-size: 20px;
            font-weight: 600;
            color: rgba(147, 112, 219, 0.9);
        }

        .match-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        /* Share Section */
        .share-section {
            text-align: center;
            padding: 24px 0 40px;
        }

        .btn-share {
            background: linear-gradient(135deg, #db7093, #ffd700);
            box-shadow: 0 4px 20px rgba(219, 112, 147, 0.4);
        }

        .btn-share:hover {
            box-shadow: 0 8px 30px rgba(219, 112, 147, 0.5);
        }

        .retake-link {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            cursor: pointer;
            margin-top: 20px;
            display: inline-block;
            transition: color 0.3s ease;
        }

        .retake-link:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-slide-up {
            animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }

        // ============ Global State ============
        let destination = "";
        let currentQuestion = 0;
        let answers = [];

        // ============ Screen Navigation ============
        function goToScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // ============ Heaven/Hell Selection ============
        function selectDestination(dest) {
            destination = dest;
            currentQuestion = 0;
            answers = [];
            goToScreen('screen-quiz');
            renderQuestion();
        }

        // ============ Quiz Functions ============
        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('questionEmoji').textContent = q.emoji;
            document.getElementById('questionText').textContent = q.text;
            document.getElementById('questionCounter').textContent = `${currentQuestion + 1}/28`;
            document.getElementById('progressBar').style.width = `${(currentQuestion / 28) * 100}%`;

            const letters = ['A', 'B', 'C', 'D'];
            const optionsHTML = q.options.map((opt, i) => `
                <button class="option-btn" onclick="selectOption(${i})">
                    <span class="option-letter">${letters[i]}</span>
                    <span class="option-text">${opt.text}</span>
                </button>
            `).join('');
            document.getElementById('optionsContainer').innerHTML = optionsHTML;
        }

        function selectOption(index) {
            document.querySelectorAll('.option-btn').forEach((btn, i) => {
                btn.classList.toggle('selected', i === index);
            });

            answers.push(questions[currentQuestion].options[index].scores);

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    renderQuestion();
                } else {
                    showLoading();
                }
            }, 350);
        }

        function showLoading() {
            goToScreen('screen-loading');
            const statuses = [
                "正在解析灵魂数据",
                "正在校准精神状态",
                "正在测算摸鱼指数",
                "正在生成灵魂图谱",
                "正在撰写诊断报告",
                "灵魂画像绘制中"
            ];
            let i = 0;
            let dots = "";
            const dotsInterval = setInterval(() => {
                dots = dots.length >= 3 ? "" : dots + "·";
                document.getElementById('loadingDots').textContent = dots;
            }, 300);

            const textInterval = setInterval(() => {
                document.getElementById('loadingText').textContent = statuses[i % statuses.length];
                i++;
                if (i >= statuses.length) {
                    clearInterval(textInterval);
                    clearInterval(dotsInterval);
                    setTimeout(showReport, 800);
                }
            }, 700);
        }

        // ============ Report Generation ============
        function showReport() {
            const scores = calculateScores();
            const primaryType = getPrimaryType(scores);
            const typeInfo = soulTypes[primaryType];

            document.getElementById('reportType').textContent = typeInfo.emoji || primaryType.split('-')[0] + " " + primaryType.split('-')[1];
            document.getElementById('reportSubtitle').textContent = typeInfo.subtitle;
            document.getElementById('picassoArt').innerHTML = typeInfo.picasso;

            drawRadarChart(scores);
            renderDimensions(scores);
            renderAnalysis(scores, primaryType);
            renderMatches(primaryType);

            goToScreen('screen-report');
        }

        function calculateScores() {
            const scores = [0, 0, 0, 0, 0];
            answers.forEach(answer => {
                answer.forEach((score, i) => {
                    scores[i] += score;
                });
            });
            return scores.map(s => Math.round(s / answers.length * 20));
        }

        function getPrimaryType(scores) {
            const typeScorePairs = [
                { type: "夜猫-社恐", score: scores[0] + scores[4] + (destination === 'heaven' ? 2 : 0) },
                { type: "卷王-焦虑", score: scores[1] + scores[5] + (destination === 'hell' ? 3 : 0) },
                { type: "躺平-自由", score: scores[3] + scores[8] + (destination === 'heaven' ? 3 : 0) },
                { type: "社牛-表演", score: scores[6] + scores[9] + (destination === 'heaven' ? 2 : 0) },
                { type: "摸鱼-大师", score: scores[7] + scores[10] + (destination === 'hell' ? 2 : 0) },
                { type: "emo-诗人", score: scores[2] + scores[11] + (destination === 'hell' ? 3 : 0) },
                { type: "吃货-快乐", score: scores[12] + scores[13] + (destination === 'heaven' ? 1 : 1) },
                { type: "极简-理性", score: scores[14] + scores[15] + (destination === 'hell' ? 2 : 2) }
            ];
            typeScorePairs.sort((a, b) => b.score - a.score);
            return typeScorePairs[0].type;
        }

        // ============ Radar Chart ============
        function drawRadarChart(scores) {
            const canvas = document.getElementById('radarChart');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;

            canvas.width = 300 * dpr;
            canvas.height = 300 * dpr;
            canvas.style.width = '300px';
            canvas.style.height = '300px';
            ctx.scale(dpr, dpr);

            const centerX = 150;
            const centerY = 150;
            const maxRadius = 110;
            const labels = ["奇葩", "焦虑", "社死", "emo", "摸鱼"];
            const levels = 5;

            for (let i = 1; i <= levels; i++) {
                ctx.beginPath();
                const r = (maxRadius / levels) * i;
                for (let j = 0; j <= labels.length; j++) {
                    const angle = (Math.PI * 2 / labels.length) * j - Math.PI / 2;
                    const x = centerX + r * Math.cos(angle);
                    const y = centerY + r * Math.sin(angle);
                    if (j === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            for (let i = 0; i < labels.length; i++) {
                const angle = (Math.PI * 2 / labels.length) * i - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + maxRadius * Math.cos(angle), centerY + maxRadius * Math.sin(angle));
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 1;
                ctx.stroke();

                const labelRadius = maxRadius + 20;
                const x = centerX + labelRadius * Math.cos(angle);
                const y = centerY + labelRadius * Math.sin(angle);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '11px Noto Sans SC';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(labels[i], x, y);
            }

            ctx.beginPath();
            for (let i = 0; i < scores.length; i++) {
                const angle = (Math.PI * 2 / scores.length) * i - Math.PI / 2;
                const r = (scores[i] / 100) * maxRadius;
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();

            const gradient = ctx.createLinearGradient(0, 0, 300, 300);
            gradient.addColorStop(0, 'rgba(147, 112, 219, 0.5)');
            gradient.addColorStop(0.5, 'rgba(219, 112, 147, 0.5)');
            gradient.addColorStop(1, 'rgba(255, 215, 0, 0.4)');
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            for (let i = 0; i < scores.length; i++) {
                const angle = (Math.PI * 2 / scores.length) * i - Math.PI / 2;
                const r = (scores[i] / 100) * maxRadius;
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.fill();
            }
        }

            setTimeout(() => {

            };

            const warnings = {
                "夜猫-社恐": "⚠️ 熬夜伤身，适度调整作息。你的社恐倾向不是缺陷，不需要强迫自己变得「外向」。",
                "卷王-焦虑": "⚠️ 身体是革命的本钱，每年体检一次。你的焦虑有时候是动力，有时候是毒药，学会区分。",
                "躺平-自由": "⚠️ 躺平是权利，但不要让「躺」变成「废」。保持基本的生存能力和社交能力。",
                "社牛-表演": "⚠️ 不要为了迎合他人而失去真实的自己。学会独处，才能真正认识自己。",
                "摸鱼-大师": "⚠️ 摸鱼是智慧，但不要摸掉自己的核心竞争力。保持学习和进步，否则35岁后会很被动。",
                "emo-诗人": "⚠️ 情绪是你的天赋，不是弱点。但学会管理情绪，不要让emo影响正常生活。",
                "吃货-快乐": "⚠️ 享受美食是生活的一部分，但不要用食物填补情感空洞。偶尔健身，对自己对家人负责。",
                "极简-理性": "⚠️ 理性是优势，但不要变得冷漠。学会欣赏生活中的非理性之美，偶尔冲动一下也无妨。"
            };

            document.getElementById('diagnosisText').textContent = diagnoses[primaryType];
            document.getElementById('guideText').textContent = guides[primaryType];
            document.getElementById('warningText').textContent = warnings[primaryType];
        }

        function renderMatches(primaryType) {
            const allTypes = Object.keys(soulTypes);
            const compatibility = {
                "夜猫-社恐": { "躺平-自由": 85, "极简-理性": 75, "emo-诗人": 80 },
                "卷王-焦虑": { "极简-理性": 70, "摸鱼-大师": 60, "吃货-快乐": 75 },
                "躺平-自由": { "夜猫-社恐": 85, "emo-诗人": 90, "吃货-快乐": 80 },
                "社牛-表演": { "吃货-快乐": 85, "卷王-焦虑": 65, "摸鱼-大师": 70 },
                "摸鱼-大师": { "躺平-自由": 80, "极简-理性": 75, "夜猫-社恐": 70 },
                "emo-诗人": { "躺平-自由": 90, "夜猫-社恐": 80, "极简-理性": 70 },
                "吃货-快乐": { "社牛-表演": 85, "躺平-自由": 80, "卷王-焦虑": 75 },
                "极简-理性": { "摸鱼-大师": 75, "夜猫-社恐": 75, "emo-诗人": 70 }
            };

            const matches = allTypes
                .filter(t => t !== primaryType)
                .map(t => {
                    let baseScore = compatibility[primaryType]?.[t] || 50;
                    baseScore += Math.floor(Math.random() * 15);
                    return { type: t, ...soulTypes[t], score: Math.min(baseScore, 98) };
                })
                .sort((a, b) => b.score - a.score)
                .slice(0, 3);

            document.getElementById('matchGrid').innerHTML = matches.map(m => `
                <div class="match-card">
                    <div class="match-picasso">${m.picasso}</div>
                    <div class="match-type">${m.type}</div>
                    <div class="match-score">${m.score}%</div>
                    <div class="match-label">共鸣度</div>
                </div>
            `).join('');
        }

        function shareResult() {
            const text = `🔮 我的DSBTI灵魂类型是：${document.getElementById('reportType').textContent}\n\n${document.getElementById('reportSubtitle').textContent}\n\n想知道你的灵魂属于哪种类型吗？来试试 DSBTI 灵魂采样系统！`;

            if (navigator.share) {
                navigator.share({ text });
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    alert('结果已复制到剪贴板，快去分享吧！');
                });
            }
        }

        function retakeQuiz() {
            destination = "";
            goToScreen('screen-choice');
        }
    </script>
</body>
